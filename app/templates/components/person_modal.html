<div class="modal-overlay" id="person-modal">
    <div class="modal">
        <div class="modal-header">
            <div>
                <h2 id="person-modal-title">Adicionar Pessoa</h2>
                <p>Preencha os dados da pessoa.</p>
            </div>

            <button class="modal-close" id="close-person-modal" type="button" aria-label="Fechar"><i data-lucide="x"></i></button>
        </div>

        <form class="person-form" id="person-form" method="POST" action="{{ url_for('index.create_person') }}">
            <div class="form-grid">
				<input type="hidden" id="person-id" name="person_id">
                <div class="form-field full-width">
                    <label for="person-name">Nome</label>
                    <input type="text" id="person-name" name="name" placeholder="Digite o nome" required>
                </div>

                <div class="form-field">
                    <label for="person-email">E-mail</label>
                    <input type="email" id="person-email" name="email" placeholder="exemplo@email.com" required>
                </div>

                <div class="form-field">
                    <label for="person-phone">Telefone</label>
                    <input type="tel" id="person-phone" name="phone" placeholder="(81) 99999-9999" minlength="14" maxlength="15" inputmode="numeric" required>
                </div>
            </div>

            <div class="modal-footer">
                <button class="delete-button" id="delete-person-button" type="button" aria-label="Remover pessoa">
                    <i data-lucide="trash-2"></i>Remover
                </button>

                <div class="modal-actions">
                    <button class="button-secondary" id="cancel-person-modal" type="button">Cancelar</button>
                    <button class="add-button" type="submit"><i data-lucide="save"></i>Salvar</button>
                </div>
            </div>
        </form>
    </div>
</div>
