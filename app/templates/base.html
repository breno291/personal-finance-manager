<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Personal Finance Manager{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

    {% block styles %}{% endblock %}
</head>

<body>
<div class="app" id="app">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">$</div>
            <div class="brand-name"> Personal Finance <span>Manager</span> </div>
        </div>

        <nav class="sidebar-nav">
            <a href="{{ url_for('index.purchases') }}" class="nav-item {% if request.path == '/' or request.path == '/purchases' %}active{% endif %}">
                <i data-lucide="shopping-cart" class="nav-icon"></i>
                <span class="nav-text">Compras</span>
            </a>

            <a href="{{ url_for('index.payment_methods') }}" class="nav-item {% if request.path == '/payment-methods' %}active{% endif %}">
                <i data-lucide="credit-card" class="nav-icon"></i>
                <span class="nav-text">Formas de Pagamento</span>
            </a>

            <a href="{{ url_for('index.transactions') }}" class="nav-item {% if request.path == '/transactions' %}active{% endif %}">
                <i data-lucide="receipt-text" class="nav-icon"></i>
                <span class="nav-text">Lançamentos</span>
            </a>

            <a href="{{ url_for('index.people') }}" class="nav-item {% if request.path == '/people' %}active{% endif %}">
                <i data-lucide="users" class="nav-icon"></i>
                <span class="nav-text">Pessoas</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="#" class="nav-item">
                <i data-lucide="settings" class="nav-icon"></i>
                <span class="nav-text">Configurações</span>
            </a>

            <a href="#" class="nav-item">
                <i data-lucide="log-out" class="nav-icon"></i>
                <span class="nav-text">Sair</span>
            </a>
        </div>
    </aside>

    <div class="page">
        <header class="topbar">
            <button class="menu-button" id="menu-button" type="button" aria-label="Fechar menu">
                <i data-lucide="panel-left-close" id="menu-icon"></i>
            </button>

            <div class="topbar-user">
                <button class="notification-button" type="button" aria-label="Notificações">
                    <i data-lucide="bell"></i>
                </button>

                <div class="user-avatar">BF</div>
                <span class="user-name">Breno</span>
                <i data-lucide="chevron-down" class="user-arrow"></i>
            </div>
        </header>

        <main class="content"> {% block content %}{% endblock %} </main>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="{{ url_for('static', filename='js/base.js') }}"></script>
</body>
</html>
