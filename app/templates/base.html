<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Personal Finance Manager{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

    {% block styles %}{% endblock %}
</head>

<body>
    <div class="app" id="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon"><i data-lucide="wallet-cards"></i></div>

                <div class="brand-name">
                    Personal Finance
                    <span>Manager</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="{{ url_for('purchases.purchases') }}" class="nav-item {% if request.path == '/' or request.path == '/purchases' %}active{% endif %}"> 
                    <i data-lucide="shopping-bag" class="nav-icon"></i><span class="nav-text">Compras</span>
                </a>

                <a href="{{ url_for('payment_methods.payment_methods') }}" class="nav-item {% if request.path == '/payment-methods' %}active{% endif %}"> 
                    <i data-lucide="credit-card" class="nav-icon"></i><span class="nav-text">Formas de Pagamento</span>
                </a>

                <a href="{{ url_for('transactions.transactions') }}" class="nav-item {% if request.path == '/transactions' %}active{% endif %}">
                    <i data-lucide="receipt" class="nav-icon"></i><span class="nav-text">Lançamentos</span>
                </a>

                <a href="{{ url_for('people.people') }}" class="nav-item {% if request.path == '/people' %}active{% endif %}">
                    <i data-lucide="users-round" class="nav-icon"></i><span class="nav-text">Pessoas</span>
                </a>
            </nav>

            <button class="sidebar-toggle" id="menu-button" type="button" aria-label="Fechar menu">
                <i data-lucide="panel-left-close" id="menu-icon"></i> <span class="nav-text">Recolher menu</span>
            </button>
        </aside>

        <div class="page">
            <main class="content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{{ url_for('static', filename='js/base.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
